name: Deploy production

on:
  workflow_dispatch:
    inputs:
      odate:
        description: Raw partition date to process in YYYY-MM-DD format.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: healthlake-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    # Configure required reviewers in this GitHub Environment.
    environment: production
    env:
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      ODATE: ${{ inputs.odate }}
    steps:
      - name: Validate production input
        shell: bash
        run: |
          if [[ ! "$ODATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "odate must use YYYY-MM-DD format" >&2
            exit 1
          fi
          parsed_date="$(date -u -d "$ODATE" +%F 2>/dev/null || true)"
          if [[ "$parsed_date" != "$ODATE" ]]; then
            echo "odate is not a valid calendar date" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: databricks/setup-cli@60b64e3937ee15f5a8b914664d1e78a586a9a4da # v1.11.0
        with:
          version: "1.11.0"
      - name: Validate production target
        working-directory: databricks
        run: databricks bundle validate --target prod
      - name: Plan production target
        working-directory: databricks
        run: databricks bundle plan --target prod
      - name: Deploy production target
        working-directory: databricks
        run: >-
          databricks bundle deploy --target prod
          --fail-on-active-runs
      - name: Run production refresh
        working-directory: databricks
        run: >-
          databricks bundle run healthlake_medallion_refresh
          --target prod
          --params "odate=${ODATE}"
