name: Run production streaming backlog

on:
  workflow_dispatch:
    inputs:
      confirm_run:
        description: Start one paid triggered run from the persisted checkpoint.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: healthlake-production-deploy
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: production
    env:
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      CONFIRM_RUN: ${{ inputs.confirm_run }}
    steps:
      - name: Require explicit paid-run confirmation
        shell: bash
        run: |
          if [[ "$CONFIRM_RUN" != "true" ]]; then
            echo "confirm_run must be enabled" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: databricks/setup-cli@60b64e3937ee15f5a8b914664d1e78a586a9a4da # v1.11.0
        with:
          version: "1.11.0"
      - name: Validate deployed production target
        working-directory: databricks
        run: databricks bundle validate --target prod
      - name: Consume the backlog once through Bronze, Silver, and Gold
        working-directory: databricks
        shell: bash
        run: |
          job_id="$(
            databricks bundle summary --target prod --output json --force-pull |
              jq -r '.resources.jobs.healthlake_vitals_streaming_refresh.id'
          )"
          if [[ ! "$job_id" =~ ^[0-9]+$ ]]; then
            echo "Could not resolve the deployed streaming Job ID" >&2
            exit 1
          fi
          databricks jobs run-now "$job_id" \
            --idempotency-token "gh-${GITHUB_RUN_ID}" \
            --timeout 70m
