name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a production deployment that is already running.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test Python code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install generator dependencies
        run: pip install -r data-generator/requirements.txt pytest
      - name: Run repository tests
        run: >-
          pytest data-generator/tests databricks/tests adf/tests
          infra/eventhub/tests
      - name: Compile Azure Bicep
        run: |
          az bicep install --version v0.46.1
          az bicep build --file infra/eventhub/main.bicep --stdout > /dev/null
          az bicep build --file infra/observability/main.bicep --stdout > /dev/null
      - name: Check Databricks Python syntax
        run: python -m compileall -q databricks/src

  validate-bundle:
    name: Validate development bundle
    needs: test
    # Fork pull requests do not receive GitHub environment secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    environment: development
    env:
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: databricks/setup-cli@60b64e3937ee15f5a8b914664d1e78a586a9a4da # v1.11.0
        with:
          version: "1.11.0"
      - name: Validate DAB target
        working-directory: databricks
        run: databricks bundle validate --target dev

  deploy-production:
    name: Deploy production after main CI
    needs: [test, validate-bundle]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-prod.yml
    secrets: inherit
    with:
      run_batch_refresh: false
      odate: ""
