name: Deploy development

on:
  push:
    branches: [develop]
    paths:
      - "databricks/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthlake-development-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    env:
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: databricks/setup-cli@60b64e3937ee15f5a8b914664d1e78a586a9a4da # v1.11.0
        with:
          version: "1.11.0"
      - name: Validate development target
        working-directory: databricks
        run: databricks bundle validate --target dev
      - name: Plan development target and restrict destructive changes
        working-directory: databricks
        shell: bash
        run: |
          set -euo pipefail
          plan_file="$RUNNER_TEMP/healthlake-dev-plan.json"

          databricks bundle plan \
            --target dev \
            --output json > "$plan_file"

          echo "Development plan actions:"
          jq -r '
            (.plan // {})
            | to_entries[]
            | select(.value.action != "skip")
            | "\(.value.action) \(.key)"
          ' "$plan_file"

          unexpected_destructive="$(
            jq -r '
              (.plan // {})
              | to_entries[]
              | select(
                  .value.action == "delete" or
                  .value.action == "recreate"
                )
              | select(
                  .value.action != "delete" or
                  (
                    .key != "resources.pipelines.healthlake_bronze" and
                    .key != "resources.pipelines.healthlake_silver" and
                    .key != "resources.pipelines.healthlake_gold"
                  )
                )
              | "\(.value.action) \(.key)"
            ' "$plan_file"
          )"

          if [[ -n "$unexpected_destructive" ]]; then
            echo "Unexpected destructive development plan blocked:" >&2
            printf '%s\n' "$unexpected_destructive" >&2
            exit 1
          fi
      - name: Deploy development target
        working-directory: databricks
        run: >-
          databricks bundle deploy --target dev
          --plan "$RUNNER_TEMP/healthlake-dev-plan.json"
          --auto-approve
          --fail-on-active-runs
