resources:
  jobs:
    healthlake_medallion_refresh:
      name: healthlake-medallion-refresh-${bundle.target}
      run_as:
        service_principal_name: ${var.run_as_service_principal_name}
      description: Processes exactly one odate through historical Bronze, Silver, and Gold Delta tables.
      max_concurrent_runs: 1
      timeout_seconds: 10800
      queue:
        enabled: true
      parameters:
        - name: odate
          default: ''
      tasks:
        - task_key: refresh_bronze
          description: Replace only the requested raw odate in the historical Bronze tables.
          spark_python_task:
            python_file: ../src/bronze/ingestion.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --raw-root
              - ${var.raw_root}
              - --odate
              - '{{job.parameters.odate}}'
          environment_key: batch_serverless
        - task_key: dq_bronze_to_silver
          description: Stop the flow and quarantine Bronze records rejected by DQX before Silver.
          depends_on:
            - task_key: refresh_bronze
          run_job_task:
            job_id: ${resources.jobs.healthlake_bronze_to_silver_dq.id}
            job_parameters:
              odate: '{{job.parameters.odate}}'
        - task_key: refresh_silver
          description: Replace only the approved odate in the historical Silver tables.
          depends_on:
            - task_key: dq_bronze_to_silver
          spark_python_task:
            python_file: ../src/silver/transforms.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --odate
              - '{{job.parameters.odate}}'
          environment_key: batch_serverless
        - task_key: dq_silver_to_gold
          description: Stop the flow and quarantine Silver records rejected by DQX before Gold.
          depends_on:
            - task_key: refresh_silver
          run_job_task:
            job_id: ${resources.jobs.healthlake_silver_to_gold_dq.id}
            job_parameters:
              odate: '{{job.parameters.odate}}'
        - task_key: refresh_gold
          description: Replace only the approved odate in the historical Gold tables and KPI.
          depends_on:
            - task_key: dq_silver_to_gold
          spark_python_task:
            python_file: ../src/gold/marts.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --odate
              - '{{job.parameters.odate}}'
          environment_key: batch_serverless
      environments:
        - environment_key: batch_serverless
          spec:
            environment_version: '2'
