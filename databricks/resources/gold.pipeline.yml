resources:
  pipelines:
    healthlake_gold:
      name: healthlake-gold-${bundle.target}
      run_as:
        service_principal_name: ${var.run_as_service_principal_name}
      catalog: ${var.catalog}
      schema: gold
      serverless: true
      continuous: false
      channel: CURRENT
      edition: ADVANCED
      configuration:
        healthlake.catalog: ${var.catalog}
      libraries:
        - glob:
            include: ../src/gold/**
