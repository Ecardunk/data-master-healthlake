resources:
  sql_warehouses:
    healthlake_observability_warehouse:
      name: healthlake-observability-${bundle.target}
      cluster_size: 2X-Small
      warehouse_type: PRO
      enable_serverless_compute: true
      enable_photon: true
      min_num_clusters: 1
      max_num_clusters: 1
      auto_stop_mins: 10

  dashboards:
    healthlake_observability_dashboard:
      display_name: HealthLake Observability - ${bundle.target}
      file_path: ../src/dashboard/healthlake_observability.lvdash.json
      warehouse_id: ${resources.sql_warehouses.healthlake_observability_warehouse.id}
      dataset_catalog: ${var.catalog}
      dataset_schema: observability
